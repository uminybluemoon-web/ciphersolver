<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>スケルトンソルバー</title>
  <link rel="stylesheet" href="../../css/tool.css" />
  <link rel="stylesheet" href="skel.css" />
</head>
<body>
  <div class="wrap">
    <h1>スケルトンソルバー</h1>
    <p class="hint">白マスの形と単語リストを入れると、縦横の交差が合う埋め方を探します。クリックで白黒を切り替え。Shift+クリックでマスを選んで文字や番号を入れます。番号は解の文字拾い順です。</p>

    <div class="layout">
      <section>
        <h2>盤面</h2>
        <div class="toolbar">
          <button type="button" class="act" id="minus">減らす</button>
          <span id="size-lab">7</span>
          <button type="button" class="act" id="plus">増やす</button>
          <button type="button" class="act" id="fill">全部白</button>
          <button type="button" class="act" id="clear-board">全部黒</button>
          <button type="button" class="act" id="sample">サンプル</button>
          <label class="cell-char-lab">マスの文字
            <input id="cell-char" type="text" lang="ja" autocomplete="off" spellcheck="false" />
          </label>
          <label class="cell-char-lab">番号
            <input id="cell-num" type="text" inputmode="numeric" autocomplete="off" />
          </label>
        </div>
        <div class="grid-wrap" id="grid"></div>
        <p class="hint" id="board-stat"></p>
      </section>
      <section>
        <h2>単語</h2>
        <textarea id="words" placeholder="1行に1語（例: あさひ）"></textarea>
        <div class="toolbar">
          <label class="chk"><input type="checkbox" id="icase" checked /> 大文字小文字を無視</label>
          <label class="chk"><input type="checkbox" id="daku" /> 濁点・半濁点を無視</label>
        </div>
        <p class="hint" id="slot-stat"></p>
      </section>
    </div>

    <div class="toolbar">
      <button type="button" class="act" id="solve">計算開始</button>
      <button type="button" class="act" id="stop" hidden>中止</button>
    </div>
    <p class="parsed" id="status">クリックで白黒を切り替えます。白マスがスロット（2マス以上の連続）になります。</p>
    <h2>答え</h2>
    <div id="sols" class="sols"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
