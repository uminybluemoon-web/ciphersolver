<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>和同開珎ソルバー</title>
  <link rel="stylesheet" href="../../css/tool.css" />
  <link rel="stylesheet" href="wadou.css" />
</head>
<body>
  <div class="wrap">
    <h1>和同開珎ソルバー</h1>
    <p class="hint">漢字を入れ、矢印をクリックして向きを反転します。空欄は未知として、熟語辞書から探します。複数個を横・縦に並べると、隣の中央同士が直接つながる連結和同開珎になります。</p>
    <div class="toolbar">
      <label>熟語の長さ
        <select id="wlen">
          <option value="2" selected>2字（各方向が二字熟語）</option>
          <option value="3">3字（縦・横が三字熟語）</option>
        </select>
      </label>
      <label>横の個数
        <input id="ncols" type="number" min="1" max="4" value="1" />
      </label>
      <label>縦の個数
        <input id="nrows" type="number" min="1" max="3" value="1" />
      </label>
      <label id="nconn-wrap">1個のときの連結
        <input id="nconn" type="number" min="1" max="4" value="4" />
      </label>
      <button type="button" class="act" id="solve">解く</button>
      <button type="button" class="act" id="clear">クリア</button>
    </div>
    <p class="hint" id="mode-hint"></p>
    <div class="coin-scroll">
      <div class="coin" id="coin"></div>
    </div>
    <div class="parsed" id="status">辞書を読み込み中…</div>
    <div id="out"></div>
    <p class="hint">熟語データは JMdict（EDRDG）の見出し漢字から二字・三字を抽出しています。辞書に無い熟語は出ません。3字モードは1個のときだけ使えます。</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
